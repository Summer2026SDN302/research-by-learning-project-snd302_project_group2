<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Đăng nhập - StallBox</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed-variant": "#005236",
                        "on-primary-fixed-variant": "#005049",
                        "surface-dim": "#d6dbd9",
                        "surface-container-high": "#e4e9e7",
                        "secondary-container": "#6cf8bb",
                        "background": "#f5faf8",
                        "on-primary-fixed": "#00201d",
                        "surface-container-low": "#f0f5f2",
                        "secondary": "#006c49",
                        "on-primary-container": "#f4fffc",
                        "on-surface": "#171d1c",
                        "on-background": "#171d1c",
                        "surface-tint": "#006a61",
                        "inverse-surface": "#2c3130",
                        "on-secondary-fixed": "#002113",
                        "primary": "#00685f",
                        "inverse-on-surface": "#edf2f0",
                        "inverse-primary": "#6bd8cb",
                        "error-container": "#ffdad6",
                        "surface-container": "#eaefed",
                        "tertiary-fixed-dim": "#ffb59a",
                        "primary-container": "#008378",
                        "surface-variant": "#dee4e1",
                        "surface-container-highest": "#dee4e1",
                        "surface-bright": "#f5faf8",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#89f5e7",
                        "primary-fixed-dim": "#6bd8cb",
                        "on-tertiary-fixed-variant": "#773215",
                        "on-secondary-container": "#00714d",
                        "outline": "#6d7a77",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "tertiary": "#924628",
                        "on-surface-variant": "#3d4947",
                        "on-tertiary-container": "#fffbff",
                        "secondary-fixed-dim": "#4edea3",
                        "tertiary-container": "#b05e3d",
                        "on-tertiary-fixed": "#370e00",
                        "surface": "#f5faf8",
                        "on-error": "#ffffff",
                        "outline-variant": "#bcc9c6",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#6ffbbe",
                        "tertiary-fixed": "#ffdbce"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "container-padding-desktop": "32px",
                        "unit": "8px",
                        "gutter": "24px",
                        "container-padding-mobile": "16px",
                        "section-gap": "40px"
                    },
                    fontFamily: {
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom styles for the tech background */
        .tech-bg {
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 131, 120, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(107, 216, 203, 0.08) 0%, transparent 50%);
        }
        .grid-overlay {
            background-image: linear-gradient(to right, rgba(188, 201, 198, 0.2) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(188, 201, 198, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden tech-bg text-on-background">
<!-- Subtle tech grid background -->
<div class="absolute inset-0 grid-overlay pointer-events-none"></div>
<!-- Login Container -->
<div class="w-full max-w-[440px] px-container-padding-mobile md:px-0 z-10 relative">
<!-- Main Card -->
<div class="bg-surface-container-lowest rounded-[16px] shadow-[0_10px_25px_-5px_rgba(0,0,0,0.05),_0_8px_10px_-6px_rgba(0,0,0,0.01)] border border-outline-variant/30 overflow-hidden relative">
<!-- AI / Brand Highlight Bar at top -->
<div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-primary to-primary-fixed"></div>
<div class="p-8">
<!-- Brand Header -->
<div class="text-center mb-10">
<div class="flex items-center justify-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">
                            point_of_sale
                        </span>
<h1 class="font-headline-lg text-headline-lg font-black text-primary tracking-tight">StallBox</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Canteen Manager Access
                    </p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Username Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface uppercase tracking-wider" for="username">
                            Tên đăng nhập
                        </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">
                                person
                            </span>
<input class="w-full pl-11 pr-4 py-3 bg-surface rounded-lg border border-outline-variant text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:border-primary focus:ring-[3px] focus:ring-primary-container/30 focus:outline-none transition-all duration-200" id="username" name="username" placeholder="Nhập mã nhân viên" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface uppercase tracking-wider" for="password">
                                Mật khẩu
                            </label>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">
                                lock
                            </span>
<input class="w-full pl-11 pr-4 py-3 bg-surface rounded-lg border border-outline-variant text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:border-primary focus:ring-[3px] focus:ring-primary-container/30 focus:outline-none transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between pt-1">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary-container bg-surface cursor-pointer transition-colors" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                                Ghi nhớ đăng nhập
                            </label>
</div>
<a class="font-body-sm text-body-sm text-primary hover:text-surface-tint font-semibold transition-colors" href="#">
                            Quên mật khẩu?
                        </a>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-surface-tint text-on-primary font-headline-sm text-headline-sm py-3 px-4 rounded-[8px] shadow-sm hover:shadow-md transition-all duration-200 active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">
                                login
                            </span>
                            Đăng nhập
                        </button>
</div>
</form>
</div>
<!-- Security Footer -->
<div class="bg-surface-container-low py-4 px-8 border-t border-outline-variant/20 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-outline text-sm">
                    encrypted
                </span>
<span class="font-label-md text-label-md text-outline">
                    Kết nối an toàn &amp; mã hóa
                </span>
</div>
</div>
<!-- Ambient shadow under card -->
<div class="absolute -bottom-6 left-1/2 -translate-x-1/2 w-[80%] h-4 bg-primary/10 blur-xl rounded-full pointer-events-none -z-10"></div>
</div>
</body></html>

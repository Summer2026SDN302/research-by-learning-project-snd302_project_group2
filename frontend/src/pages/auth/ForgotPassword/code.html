<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#00685f",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-tint": "#006a61",
                        "tertiary-fixed": "#ffdbce",
                        "tertiary-container": "#b05e3d",
                        "surface": "#f5faf8",
                        "on-primary-fixed": "#00201d",
                        "inverse-surface": "#2c3130",
                        "background": "#f5faf8",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-container-high": "#e4e9e7",
                        "secondary": "#006c49",
                        "on-tertiary-fixed-variant": "#773215",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f5faf8",
                        "secondary-fixed": "#6ffbbe",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#4edea3",
                        "on-tertiary-container": "#fffbff",
                        "inverse-on-surface": "#edf2f0",
                        "primary-fixed": "#89f5e7",
                        "surface-dim": "#d6dbd9",
                        "surface-container": "#eaefed",
                        "tertiary-fixed-dim": "#ffb59a",
                        "inverse-primary": "#6bd8cb",
                        "surface-variant": "#dee4e1",
                        "error-container": "#ffdad6",
                        "outline": "#6d7a77",
                        "secondary-container": "#6cf8bb",
                        "on-surface-variant": "#3d4947",
                        "on-error": "#ffffff",
                        "on-surface": "#171d1c",
                        "primary-container": "#008378",
                        "on-tertiary-fixed": "#370e00",
                        "outline-variant": "#bcc9c6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "16px",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-desktop": "32px",
                        "section-gap": "40px",
                        "gutter": "24px",
                        "unit": "8px",
                        "container-padding-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5faf8;
            background-image: 
                radial-gradient(#bcc9c6 0.5px, transparent 0.5px), 
                radial-gradient(#bcc9c6 0.5px, #f5faf8 0.5px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .soft-glow-focus:focus-within {
            box-shadow: 0 0 0 3px rgba(0, 104, 95, 0.15);
        }
        .ambient-shadow {
            box-shadow: 0px 4px 6px -1px rgba(0, 0, 0, 0.05), 0px 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-spacing-container-mobile md:p-spacing-container-desktop">
<!-- Auth Card Container -->
<main class="w-full max-w-[448px] bg-white rounded-2xl border border-outline-variant ambient-shadow overflow-hidden relative">
<!-- Gradient Accent Bar -->
<div class="h-1.5 w-full bg-gradient-to-r from-primary to-primary-fixed"></div>
<div class="px-8 pt-10 pb-12 flex flex-col items-center">
<!-- Brand Identity -->
<div class="flex flex-col items-center gap-2 mb-8">
<div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-[28px]" data-icon="point_of_sale">point_of_sale</span>
</div>
<h2 class="font-headline-sm text-headline-sm font-black text-primary tracking-tight">StallBox</h2>
</div>
<!-- Header Content -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-3">Quên mật khẩu</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto">
                    Nhập mã nhân viên hoặc email đăng ký để nhận liên kết đặt lại mật khẩu.
                </p>
</div>
<!-- Form Section -->
<form action="#" class="w-full space-y-6" onsubmit="event.preventDefault(); alert('Yêu cầu đã được gửi!');">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="identifier">Email hoặc Mã nhân viên</label>
<div class="relative group soft-glow-focus rounded-lg transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-0 transition-all" id="identifier" name="identifier" placeholder="username@stallbox.com" required="" type="text">
</div>
</div>
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-4 rounded-lg hover:bg-primary-container transition-all duration-300 transform active:scale-[0.98] ambient-shadow flex items-center justify-center gap-2" type="submit">
                    Gửi yêu cầu đặt lại
                </button>
</form>
<!-- Navigation Footer -->
<div class="mt-10 flex flex-col items-center gap-6 w-full">
<a class="flex items-center gap-2 font-label-md text-label-md text-primary hover:text-primary-container transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
                    Quay lại Đăng nhập
                </a>
<div class="w-full h-px bg-outline-variant opacity-50"></div>
<p class="font-label-md text-label-md text-outline">
                    © 2024 StallBox Canteen Manager.
                </p>
</div>
</div>
<!-- Decorative Element -->
<div class="absolute -bottom-12 -right-12 w-32 h-32 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -top-12 -left-12 w-32 h-32 bg-primary-fixed/10 rounded-full blur-3xl"></div>
</main>
<!-- Contextual Information (Optional for a login page but helpful for visual balance) -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 hidden lg:flex items-center gap-4 text-on-surface-variant/60">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]" data-icon="verified_user">verified_user</span>
<span class="font-label-md text-label-md">Bảo mật đa tầng</span>
</div>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]" data-icon="psychology">psychology</span>
<span class="font-label-md text-label-md">AI Insights Integrated</span>
</div>
</div>
<script>
        // Simple micro-interaction for input icon switching based on content type
        const inputField = document.getElementById('identifier');
        const iconSpan = inputField.previousElementSibling.querySelector('.material-symbols-outlined');

        inputField.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.includes('@')) {
                iconSpan.textContent = 'mail';
            } else {
                iconSpan.textContent = 'person';
            }
        });
    </script>
</body></html>

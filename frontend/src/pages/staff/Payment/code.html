<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>StallBox POS - Thanh toán</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .payment-card-selected {
            border: 2px solid #00685f;
            background-color: #f4fffc;
        }
    </style>
<script id="tailwind-config">

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary": "#ffffff",
                      "primary-fixed": "#89f5e7",
                      "tertiary-container": "#b05e3d",
                      "primary-container": "#008378",
                      "on-secondary": "#ffffff",

                      "on-primary-fixed": "#00201d",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-highest": "#dee4e1",
                      "on-tertiary-fixed": "#370e00",
                      "on-background": "#171d1c",
                      "error-container": "#ffdad6",
                      "on-secondary-fixed": "#002113",
                      "primary": "#00685f",
                      "inverse-surface": "#2c3130",
                      "error": "#ba1a1a",
                      "background": "#f5faf8",
                      "on-error-container": "#93000a",
                      "inverse-primary": "#6bd8cb",
                      "tertiary-fixed-dim": "#ffb59a",
                      "on-surface": "#171d1c",
                      "inverse-on-surface": "#edf2f0",
                      "surface-dim": "#d6dbd9",
                      "outline": "#6d7a77",
                      "tertiary-fixed": "#ffdbce",
                      "on-error": "#ffffff",

                      "surface-container": "#eaefed",
                      "secondary-fixed-dim": "#4edea3",
                      "on-tertiary-fixed-variant": "#773215",
                      "on-surface-variant": "#3d4947",
                      "on-secondary-fixed-variant": "#005236",
                      "on-primary-container": "#f4fffc",
                      "surface-container-low": "#f0f5f2",
                      "on-tertiary-container": "#fffbff",
                      "on-secondary-container": "#00714d",
                      "secondary-container": "#6cf8bb",
                      "on-primary-fixed-variant": "#005049",
                      "primary-fixed-dim": "#6bd8cb",
                      "outline-variant": "#bcc9c6",

                      "surface-tint": "#006a61",
                      "secondary": "#006c49",

              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "8px",
                      "gutter": "24px",
                      "container-padding-mobile": "16px",
                      "container-padding-desktop": "32px",
                      "section-gap": "40px"
              },
              "fontFamily": {
                      "headline-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "display-lg": ["Inter"],
                      "label-md": ["Inter"],
                      "headline-sm": ["Inter"],
                      "body-lg": ["Inter"],
                      "body-md": ["Inter"],

              "fontSize": {
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],

            },
          },

</head>
<body class="bg-background font-body-md text-on-surface overflow-hidden">
<!-- Blurred Background POS Layout -->
<div class="flex h-screen w-full blur-sm pointer-events-none opacity-50">
<!-- SideNavBar -->
<aside class="h-screen w-64 fixed left-0 top-0 flex flex-col py-unit-gutter bg-surface border-r border-outline-variant shadow-sm z-10">
<div class="px-gutter mb-8">
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">Canteen POS</h1>
<p class="text-on-surface-variant font-label-md">Staff Terminal 01</p>
</div>
<nav class="flex-1">
<div class="px-4 space-y-2">
<div class="flex items-center gap-3 p-3 rounded-lg text-primary font-bold border-r-4 border-primary bg-primary-container/10">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span>Dashboard</span>
</div>
<div class="flex items-center gap-3 p-3 rounded-lg text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="point_of_sale">point_of_sale</span>
<span>POS</span>
</div>
<div class="flex items-center gap-3 p-3 rounded-lg text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span>Lịch sử đơn của tôi</span>
</div>
</div>
</nav>
</aside>
<!-- Main Content Area -->
<main class="ml-64 flex-1 p-container-padding-desktop">
<div class="grid grid-cols-12 gap-gutter">
<div class="col-span-8 space-y-6">
<div class="h-16 bg-surface-container rounded-xl"></div>
<div class="grid grid-cols-3 gap-4">
<div class="h-40 bg-surface-container-high rounded-xl"></div>
<div class="h-40 bg-surface-container-high rounded-xl"></div>
<div class="h-40 bg-surface-container-high rounded-xl"></div>
</div>
</div>
<div class="col-span-4 bg-white border border-outline-variant rounded-xl h-[calc(100vh-64px)]"></div>
</div>
</main>
</div>
<!-- Payment Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
<div class="bg-surface w-full max-w-4xl max-h-[921px] rounded-[24px] shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Modal Header -->
<div class="px-gutter py-6 border-b border-outline-variant flex justify-between items-center bg-white">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Xác nhận Thanh toán</h2>
<p class="text-on-surface-variant font-body-sm">Đơn hàng #SB-20231024-001</p>
</div>
<div class="text-right">
<p class="font-label-md text-primary uppercase tracking-wider">Tổng cộng</p>
<p class="font-display-lg text-display-lg text-primary">124,200đ</p>
</div>
</div>
<div class="flex-1 overflow-y-auto p-gutter grid grid-cols-12 gap-8">
<!-- Left: Payment Methods Selection -->
<div class="col-span-5 space-y-6">
<h3 class="font-headline-sm text-headline-sm mb-4">Phương thức</h3>
<div class="space-y-4">
<!-- Cash Option -->
<button class="payment-card-selected w-full flex items-center gap-4 p-4 rounded-xl border-2 border-outline-variant hover:border-primary transition-all text-left" id="method-cash" onclick="selectMethod('cash')">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-3xl" data-icon="payments">payments</span>
</div>
<div>
<p class="font-headline-sm text-headline-sm">Tiền mặt</p>
<p class="text-on-surface-variant text-sm">Thanh toán trực tiếp</p>
</div>
</button>
<!-- Card Option -->
<button class="w-full flex items-center gap-4 p-4 rounded-xl border-2 border-outline-variant hover:border-primary transition-all text-left bg-white" id="method-card" onclick="selectMethod('card')">
<div class="w-12 h-12 rounded-full bg-secondary/10 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-3xl" data-icon="credit_card">credit_card</span>
</div>
<div>
<p class="font-headline-sm text-headline-sm">Thẻ ATM/Credit</p>
<p class="text-on-surface-variant text-sm">Visa, Mastercard, Napas</p>
</div>
</button>
<!-- VietQR Option -->
<button class="w-full flex items-center gap-4 p-4 rounded-xl border-2 border-outline-variant hover:border-primary transition-all text-left bg-white" id="method-qr" onclick="selectMethod('qr')">
<div class="w-12 h-12 rounded-full bg-tertiary-container/10 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined text-3xl" data-icon="qr_code_2">qr_code_2</span>
</div>
<div>
<p class="font-headline-sm text-headline-sm">Chuyển khoản QR</p>
<p class="text-on-surface-variant text-sm">Quét mã VietQR nhanh</p>
</div>
</button>
</div>
</div>
<!-- Right: Cash Input / Calculation -->
<div class="col-span-7 flex flex-col">
<div class="bg-surface-container-low rounded-2xl p-6 flex-1 flex flex-col" id="cash-panel">
<div class="mb-6 grid grid-cols-2 gap-4">
<div>
<label class="font-label-md text-on-surface-variant mb-2 block">Số tiền khách đưa</label>
<div class="relative">
<input class="w-full bg-white border-2 border-primary rounded-xl px-4 py-3 text-2xl font-bold text-on-surface text-right focus:outline-none focus:ring-4 focus:ring-primary/10" id="cash-input" readonly="" type="text" value="200,000">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-primary">đ</span>
</div>
</div>
<div>
<label class="font-label-md text-on-surface-variant mb-2 block text-right">Tiền thừa trả khách</label>
<p class="text-2xl font-bold text-secondary text-right py-3" id="change-display">75,800đ</p>
</div>
</div>
<!-- Numeric Keypad -->
<div class="grid grid-cols-3 gap-2 flex-1">
<button class="h-full bg-white rounded-lg shadow-sm font-headline-md active:bg-surface-container transition-colors py-4" onclick="appendNum('1')">1</button>
<button class="h-full bg-white rounded-lg shadow-sm font-headline-md active:bg-surface-container transition-colors py-4" onclick="appendNum('2')">2</button>
<button class="h-full bg-white rounded-lg shadow-sm font-headline-md active:bg-surface-container transition-colors py-4" onclick="appendNum('3')">3</button>
<button class="h-full bg-white rounded-lg shadow-sm font-headline-md active:bg-surface-container transition-colors py-4" onclick="appendNum('4')">4</button>
<button class="h-full bg-white rounded-lg shadow-sm font-headline-md active:bg-surface-container transition-colors py-4" onclick="appendNum('5')">5</button>
<button class="h-full bg-white rounded-lg shadow-sm font-headline-md active:bg-surface-container transition-colors py-4" onclick="appendNum('6')">6</button>
<button class="h-full bg-white rounded-lg shadow-sm font-headline-md active:bg-surface-container transition-colors py-4" onclick="appendNum('7')">7</button>
<button class="h-full bg-white rounded-lg shadow-sm font-headline-md active:bg-surface-container transition-colors py-4" onclick="appendNum('8')">8</button>
<button class="h-full bg-white rounded-lg shadow-sm font-headline-md active:bg-surface-container transition-colors py-4" onclick="appendNum('9')">9</button>
<button class="h-full bg-error-container/20 text-error rounded-lg shadow-sm font-headline-sm transition-colors py-4" onclick="clearNum()">C</button>
<button class="h-full bg-white rounded-lg shadow-sm font-headline-md active:bg-surface-container transition-colors py-4" onclick="appendNum('0')">0</button>
<button class="h-full bg-white rounded-lg shadow-sm font-headline-sm active:bg-surface-container transition-colors py-4" onclick="appendNum('000')">.000</button>
</div>
<div class="mt-4 grid grid-cols-3 gap-2">
<button class="bg-white/50 border border-outline-variant rounded-lg py-2 text-sm hover:bg-white" onclick="setCash(130000)">Đúng số tiền</button>
<button class="bg-white/50 border border-outline-variant rounded-lg py-2 text-sm hover:bg-white" onclick="setCash(200000)">200,000</button>
<button class="bg-white/50 border border-outline-variant rounded-lg py-2 text-sm hover:bg-white" onclick="setCash(500000)">500,000</button>
</div>
</div>
<!-- Non-Cash Panel (Hidden by default) -->
<div class="hidden bg-white rounded-2xl p-6 flex-1 flex flex-col items-center justify-center text-center space-y-4 border-2 border-dashed border-outline-variant" id="qr-panel">
<img class="w-48 h-48 rounded-lg shadow-md border border-outline-variant" data-alt="A clean, minimalist QR code displayed on a modern digital screen for payment processing. The QR is crisp and black against a white background, framed by subtle tech-inspired graphics. Soft studio lighting from the side emphasizes the screen's sleek surface. The surrounding environment is a blurry, high-end canteen interior with teal and white accents, maintaining a professional and reliable vibe." src="https://lh3.googleusercontent.com/aida/ADBb0ugvKvelhN8pvRzNS3Alhfo2mKh4Gqo2Vjkpbl9HwJl21_-IVe-KQxYR5gbA9V3vOCDg8Y3ppNSf92VNlwCC3TE4HrKjjqd4_StG3U6-ecMIkqU9IQVuPgC2cJbczCbJoY08FMk2l43aYekR1tE6GfSMOPIaPC5jZbYtaYzVZyIXZ8khyHU9eMHq6B2Ezzxmnkl_ViIo-0Bd_OAzJiuGrZ-NAP_crpriuis-bZKz9-o7VhlxWVKiizlPnn8">
<div>
<p class="font-headline-sm">Quét mã VietQR</p>
<p class="text-on-surface-variant text-sm max-w-xs mx-auto">Vui lòng hướng dẫn khách hàng quét mã để thực hiện thanh toán tự động.</p>
</div>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="px-gutter py-6 bg-surface-container flex gap-4">
<button class="flex-1 py-4 px-6 rounded-xl border border-outline-variant font-headline-sm text-on-surface-variant hover:bg-surface-container-high transition-all" onclick="history.back()">
                    Quay lại
                </button>
<button class="flex-[2] py-4 px-6 rounded-xl bg-primary text-on-primary font-headline-sm shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2" id="confirm-btn">
<span class="material-symbols-outlined" data-icon="print">print</span>
                    Xác nhận &amp; In hóa đơn
                </button>
</div>
</div>
</div>
<script>
        let currentCash = "200000";
        const total = 124200;

        function selectMethod(method) {
            const methods = ['cash', 'card', 'qr'];
            methods.forEach(m => {
                const el = document.getElementById(`method-${m}`);
                el.classList.remove('payment-card-selected');
                el.classList.add('bg-white');
            });

            document.getElementById(`method-${method}`).classList.add('payment-card-selected');
            document.getElementById(`method-${method}`).classList.remove('bg-white');

            const cashPanel = document.getElementById('cash-panel');
            const qrPanel = document.getElementById('qr-panel');

            if (method === 'cash') {
                cashPanel.classList.remove('hidden');
                qrPanel.classList.add('hidden');
            } else {
                cashPanel.classList.add('hidden');
                qrPanel.classList.remove('hidden');
            }
        }

        function updateDisplay() {
            const input = document.getElementById('cash-input');
            const change = document.getElementById('change-display');
            
            const numVal = parseInt(currentCash) || 0;
            input.value = numVal.toLocaleString('vi-VN');
            
            const diff = numVal - total;
            if (diff >= 0) {
                change.innerText = diff.toLocaleString('vi-VN') + "đ";
                change.classList.remove('text-error');
                change.classList.add('text-secondary');
            } else {
                change.innerText = "Chưa đủ";
                change.classList.remove('text-secondary');
                change.classList.add('text-error');
            }
        }

        function appendNum(num) {
            if (currentCash === "0") currentCash = "";
            currentCash += num;
            updateDisplay();
        }

        function clearNum() {
            currentCash = "0";
            updateDisplay();
        }

        function setCash(val) {
            currentCash = val.toString();
            updateDisplay();
        }

        // Initialize display
        updateDisplay();

        // Confirmation interaction
        document.getElementById('confirm-btn').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Đang xử lý...';
            setTimeout(() => {
                alert('Thanh toán thành công! Hóa đơn đang được in.');
                location.reload();
            }, 1500);
        });
    </script>
</body></html>
